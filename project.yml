name: RouteReplay
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Match the installed Xcode (26.6) so Xcode stops asking to "Update to
  # recommended settings". Controls LastUpgradeCheck in the project file.
  xcodeVersion: "2660"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # Recommended settings for current Xcode versions (Xcode 26 templates).
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  RouteReplay:
    type: application
    platform: iOS
    sources:
      - RouteReplay
    entitlements:
      path: RouteReplay/RouteReplay.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: RouteReplay/Info.plist
      properties:
        CFBundleDisplayName: Route Replay
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "Route Replay reads your workouts, GPS routes, heart rate and activity data from Health so you can browse and replay every outdoor workout on the map."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RouteReplay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    scheme:
      testTargets:
        - RouteReplayTests
        - RouteReplayUITests
  RouteReplayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RouteReplayUITests
    dependencies:
      - target: RouteReplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RouteReplayUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RouteReplay
  RouteReplayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RouteReplayTests
    dependencies:
      - target: RouteReplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RouteReplayTests
        GENERATE_INFOPLIST_FILE: YES
