<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Route Replay — watch the launch film</title>
<desc id="desc">A minimal dark green editorial poster with a lime route line and a circular play icon. This is illustrative key art, not an app screenshot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1c18"/><stop offset=".65" stop-color="#19372d"/><stop offset="1" stop-color="#10221c"/></linearGradient>
  <radialGradient id="spot" cx="65%" cy="46%" r="65%"><stop stop-color="#4c6e44" stop-opacity=".28"/><stop offset="1" stop-color="#223d2e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#b8cfac" stroke-opacity=".09"/></pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#spot)"/>
<rect x="470" width="730" height="630" fill="url(#grid)"/>
<g opacity=".18" fill="none" stroke="#b8cfac"><circle cx="910" cy="308" r="110"/><circle cx="910" cy="308" r="205"/><circle cx="910" cy="308" r="296"/></g>
