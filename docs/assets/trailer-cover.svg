<path d="M699 482C734 450 785 428 798 373S770 269 820 232 903 284 948 232 985 131 1042 163 1086 252 1146 214" fill="none" stroke="#d7f06b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="699" cy="482" r="10" fill="#d7f06b" stroke="#173025" stroke-width="5"/>
<circle cx="1146" cy="214" r="13" fill="none" stroke="#d7f06b" stroke-width="5"/><circle cx="1146" cy="214" r="4" fill="#d7f06b"/>
<text x="72" y="88" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#eff4e9" font-weight="700" letter-spacing="4">ROUTE REPLAY</text>
<line x1="72" y1="113" x2="1128" y2="113" stroke="#aebdac" stroke-opacity=".24"/>
<text x="72" y="220" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#d7f06b">THE LAUNCH FILM</text>
<text x="68" y="320" font-family="Arial,Helvetica,sans-serif" font-size="77" font-weight="700" letter-spacing="-3" fill="#f5f7ef">EVERY ROUTE</text>
<text x="68" y="399" font-family="Arial,Helvetica,sans-serif" font-size="77" font-weight="700" letter-spacing="-3" fill="#f5f7ef">HAS A STORY.</text>
<text x="72" y="457" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#b9c8bc">Relive your workouts in 3D.</text>
<g transform="translate(73 508)">
