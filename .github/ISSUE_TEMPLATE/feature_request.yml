name: Feature request
description: Propose a focused improvement to Route Replay.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the user need, not just the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful implementation and expected behavior.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Constraints and alternatives
      description: Consider HealthKit privacy, MapKit constraints, testability, and other solutions.
